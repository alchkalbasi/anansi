- name: Create Garage directories
  ansible.builtin.file:
    path: "{{ service_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0755" }
    - { path: "meta", mode: "0750" }
    - { path: "data", mode: "0750" }
    - { path: "secrets", mode: "0700" }
    - { path: "secrets/keys", mode: "0700" }
  loop_control:
    label: "{{ service_dir }}/{{ item.path }}"
  tags:
    - service-dir

- name: Copy the compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ service_dir }}/compose.yml"
    mode: "0644"
  tags:
    - compose-file
