networks:
  prinet:
    name: ${PRIVATE_NETWORK}
    external: true
  pubnet:
    name: ${PUBLIC_NETWORK}
    external: true

services:
  vaultwarden-db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: ${POSTGRES_CONTAINER_NAME}
    security_opt:
      - "no-new-privileges:true"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - prinet # no published port: only vaultwarden talks to it
    restart: ${VAULTWARDEN_RESTART_POLICY}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_IMAGE_TAG}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    security_opt:
      - "no-new-privileges:true"
    env_file:
      - ./vaultwarden.env # app settings and secrets, templated by Ansible (0600)
    ports:
      - "${VAULTWARDEN_BIND_HOST}:${VAULTWARDEN_HTTP_PORT}:80"
    volumes:
      - ./data:/data # rsa keys, attachments, sends, icon cache
    networks:
      - prinet
      - pubnet
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    restart: ${VAULTWARDEN_RESTART_POLICY}
    # the image ships its own HEALTHCHECK (/healthcheck.sh)
    labels:
      - "traefik.enable=${VAULTWARDEN_TRAEFIK_ENABLED}"
      - "traefik.docker.network=${PUBLIC_NETWORK}"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      # web vault, API and websocket notifications
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_HOSTNAME}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=${VAULTWARDEN_TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=${VAULTWARDEN_TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      # admin panel: only from allowed source ranges
      - "traefik.http.middlewares.vaultwarden-admin-ipallow.ipallowlist.sourcerange=${VAULTWARDEN_ADMIN_ALLOWED_IPS}"
      - "traefik.http.routers.vaultwarden-admin.rule=Host(`${VAULTWARDEN_HOSTNAME}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.vaultwarden-admin.entrypoints=${VAULTWARDEN_TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.vaultwarden-admin.tls=true"
      - "traefik.http.routers.vaultwarden-admin.tls.certresolver=${VAULTWARDEN_TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.vaultwarden-admin.middlewares=vaultwarden-admin-ipallow"
      - "traefik.http.routers.vaultwarden-admin.service=vaultwarden"
