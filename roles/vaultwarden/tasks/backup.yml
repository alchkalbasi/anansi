- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ vaultwarden_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - backup

- name: Template the backup script
  ansible.builtin.template:
    src: vaultwarden-backup.sh.j2
    dest: "{{ vaultwarden_backup_script_path }}"
    owner: root
    group: root
    mode: "0750"
  tags:
    - backup

- name: Create cron file under /etc/cron.d for Vaultwarden backups
  ansible.builtin.cron:
    name: vaultwarden-backup
    hour: "{{ vaultwarden_backup_cron_hour }}"
    minute: "{{ vaultwarden_backup_cron_minute }}"
    user: root
    job: "{{ vaultwarden_backup_script_path }} >> {{ vaultwarden_backup_log_path }} 2>&1"
    cron_file: "{{ vaultwarden_backup_cron_file }}"
  tags:
    - backup
    - cron
