- name: Validate Vaultwarden settings
  ansible.builtin.assert:
    that:
      - vaultwarden_domain is match('^https://')
      - vaultwarden_hostname | length > 0
      - (vaultwarden_smtp_host | length == 0) or (vaultwarden_smtp_from | length > 0)
      - >-
        not vaultwarden_sso_enabled or
        (vaultwarden_sso_authority | length > 0 and vaultwarden_sso_client_id | length > 0
         and vaultwarden_sso_client_secret | length > 0)
      - >-
        not vaultwarden_push_enabled or
        (vaultwarden_push_installation_id | length > 0 and vaultwarden_push_installation_key | length > 0)
      - vaultwarden_push_region in vaultwarden_push_uris
      - vaultwarden_quoted_values | select('search', "'") | list | length == 0
    fail_msg: >-
      Check vaultwarden_domain (must be https://...), SMTP (smtp_from is needed with smtp_host),
      SSO (authority, client_id, client_secret), push (installation id/key, region us|eu),
      and that no secret contains a single quote.
  tags:
    - validate

- name: Warn when signup email verification has no SMTP to send mails
  ansible.builtin.debug:
    msg: >-
      vaultwarden_signups_verify is on but SMTP is not configured: invitations still work,
      but no emails (invites, verification, 2FA codes) will be sent.
  when:
    - vaultwarden_signups_verify
    - vaultwarden_smtp_host | length == 0
  tags:
    - validate

- name: Create Vaultwarden directories
  ansible.builtin.file:
    path: "{{ service_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0755" }
    - { path: "data", mode: "0700" }
    - { path: "postgres", mode: "0700" }
    - { path: "secrets", mode: "0700" }
  loop_control:
    label: "{{ service_dir }}/{{ item.path }}"
  tags:
    - service-dir

- name: Copy the compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ service_dir }}/compose.yml"
    mode: "0644"
  tags:
    - compose-file
